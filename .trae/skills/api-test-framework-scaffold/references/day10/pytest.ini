[pytest]
# 注册自定义标记，避免 PytestUnknownMarkWarning
markers =
    smoke: 冒烟用例集，只覆盖核心链路
    crud: 增删改查用例集
    auth: 认证与鉴权用例集，登录、令牌与未授权访问
    ai: 启用 AI 自然语言断言或 AI 排错的用例集
    demo_fail: 故意失败的演示用例，用于验证 AI 自动排错链路
# 默认命令行参数：显示详细用例名与执行过程输出
addopts = -v -s
# 用例收集路径。只收集 test_case 目录，避免误收集 utils 下的脚本
testpaths = test_case
# 用例 id 中保留中文原文，不转义成 \uXXXX。
# pytest 默认会把非 ASCII 字符转义（ascii_escaped），中文用例名会显示成
# test_login_from_yaml[login001-\u767b\u5f55\u6210\u529f] 这样的一串转义码。
# 打开这个开关后 id 直接显示中文，便于终端里看用例名。
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = True
