basic_configuration:
  case_type: "WebCase" #WebCase AppCase ApiCase
  case_title: "login"
  module: "login"
  function: "login"

setup_script:
  - "context.update({'email': 'hongzuo.chen@gen-x.tech', 'password': 'Test123456@'})"

teardown_script:
  - ""

case_steps:
  - open_url:
      request_method: "open_url"
      request_url: "{{url}}/auth/login"

  - enter_account_name:
      request_method: "input_text"
      element_position: "login"
      element: "email_input"
      text: "{{email}}"
      timeout: "1"

  - enter_password:
      request_method: "input_text"
      element_position: "login"
      element: "password_input"
      text: "{{password}}"

  - click_login_button:
      request_method: "click_element"
      element_position: "login"
      element: "login_button"
