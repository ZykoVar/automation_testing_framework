url: "https://dev-rzforex-2.0.gen-x.dev"

key_dir: "./HAT/key_dir"

driver_reuse: True

_browser_config:
  grid_url: "" # 远程地址 grid 分布式运行
  driver_path: "/opt/homebrew/bin/chromedriver" # 驱动地址
  capability:
    "browser_name": "chrome"
  options:
    args:
      - "--incognito"

